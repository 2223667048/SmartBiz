global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules.yml
scrape_configs:
  - job_name: smartbiz-web
    metrics_path: /internal/metrics
    authorization:
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["smartbiz:8000"]
  - job_name: smartbiz-operations
    static_configs:
      - targets: ["ops-exporter:9105"]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
