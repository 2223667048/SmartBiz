<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>智企 AI · SmartBiz Agent</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <main class="layout">
    <header><div><p class="eyebrow">SMARTBIZ AI · MVP</p><h1>企业智能客服 Agent</h1>
      <p class="subtitle">让知识库回答问题，让客户需求留下来。</p></div>
      <div style="display:flex;gap:12px;align-items:center"><a href="/admin" style="font-size:13px;color:#335c98">知识库后台</a><button id="new-session" class="muted" type="button">新建会话</button></div></header>
    <section class="chat" aria-label="AI 问答">
      <div id="conversation" class="conversation" aria-live="polite">
        <article class="bubble bot">你好，我是智企 AI。你可以询问企业业务，也可以提交咨询需求。当前是否为真实 AI 取决于服务端 AGENT_MODE 配置。</article>
      </div>
      <form id="chat-form" class="input-row"><label for="question" class="sr-only">输入问题</label>
        <input id="question" maxlength="2000" required placeholder="例如：你们的产品如何收费？" autocomplete="off">
        <button id="send" type="submit">发送</button></form>
      <p id="status" class="status" role="status"></p>
    </section>
    <section class="lead"><h2>留下咨询需求</h2>
      <p class="subtitle">仅在你主动提交后，系统才会保存以下联系方式。</p>
      <form id="lead-form">
        <div class="two"><label>称呼<input name="name" maxlength="60" required placeholder="张先生"></label>
          <label>联系方式<input name="contact" maxlength="100" minlength="5" required placeholder="邮箱或电话"></label></div>
        <label>希望解决什么问题？<textarea name="requirement" maxlength="2000" required placeholder="请说明业务需求"></textarea></label>
        <label class="consent"><input type="checkbox" name="consent" required> 我同意保存上述信息以便联系；演示项目未提供自动删除功能。</label>
        <button type="submit" id="lead-send">提交需求</button><span id="lead-status" role="status"></span>
      </form>
    </section>
    <section class="lead"><h2>转人工处理（工单）</h2>
      <p class="subtitle">复杂问题可以登记为待处理工单。这里是记录功能，不会自动通知真人客服。</p>
      <form id="ticket-form">
        <label>问题主题<input name="subject" minlength="3" maxlength="100" required placeholder="例如：希望对接内部 CRM"></label>
        <label>详细说明<textarea name="description" minlength="5" maxlength="2000" required></textarea></label>
        <button type="submit" id="ticket-send">创建工单</button><span id="ticket-status" role="status"></span>
      </form>
      <button type="button" id="ticket-refresh" class="muted">查看本会话工单</button>
      <ul id="ticket-list"></ul>
    </section>
    <footer>演示系统：不输入个人敏感信息或机密文件。未经安全加固，请勿部署为公开商业服务。</footer>
  </main>
</body>
</html>
