# Local development demo, NOT a production public-facing deployment.
services:
  smartbiz:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      SMARTBIZ_DB_PATH: /data/smartbiz.sqlite3
      SMARTBIZ_UPLOAD_DIR: /data/tenant-uploads
      LANGFLOW_URL: http://langflow:7860
    volumes:
      - smartbiz-data:/data
    depends_on:
      - langflow
  worker:
    build: .
    command: ["python", "-m", "app.tenant_worker"]
    env_file: .env
    environment:
      SMARTBIZ_DB_PATH: /data/smartbiz.sqlite3
      SMARTBIZ_UPLOAD_DIR: /data/tenant-uploads
    volumes:
      - smartbiz-data:/data
    restart: unless-stopped
  langflow:
    image: langflowai/langflow:latest
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      LANGFLOW_AUTO_LOGIN: "false"
      LANGFLOW_SUPERUSER: langflow
      LANGFLOW_SUPERUSER_PASSWORD: ${LANGFLOW_SUPERUSER_PASSWORD:?Set a strong password in .env}
      LANGFLOW_CONFIG_DIR: /app/langflow
      LANGFLOW_SAVE_DB_IN_CONFIG_DIR: "true"
      LANGFLOW_DATABASE_URL: sqlite:////app/langflow/langflow.db
      # Knowledge retrieval: internal shared knowledge tool. Empty key means KB remains disabled.
      KB_SERVICE_KEY: ${KB_SERVICE_KEY:-}
      # SSRF
      LANGFLOW_SSRF_PROTECTION_ENABLED: "true"
      LANGFLOW_SSRF_ALLOWED_HOSTS: "smartbiz"
    volumes:
      - langflow-data:/app/langflow
volumes:
  smartbiz-data:
  langflow-data:
