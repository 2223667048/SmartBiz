# Apply AFTER docker-compose.pg.yml; requires explicit .env.gateway.
services:
  smartbiz:
    env_file:
      - .env
      - .env.gateway
    environment:
      GATEWAY_ENABLED: ${GATEWAY_ENABLED:-false}
  migrate:
    build: .

  # Fully isolated, disposable PostgreSQL test cluster. No host port and no
  # production data volume; never point production DSNs at this database.
  postgres-test10:
    profiles: ['pgtest10']
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: smartbiz_owner
      POSTGRES_DB: smartbiz_test10
      POSTGRES_PASSWORD: ${PG_OWNER_PASSWORD:?Missing test owner password}
      PG_APP_PASSWORD: ${PG_APP_PASSWORD:?Missing test app password}
      PG_WORKER_PASSWORD: ${PG_WORKER_PASSWORD:?Missing test worker password}
    volumes:
      - ./docker/postgres-init/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U smartbiz_owner -d smartbiz_test10']
      interval: 5s
      retries: 20
      timeout: 5s
  migrate-test10:
    profiles: ['pgtest10']
    build: .
    command: ['alembic','upgrade','head']
    environment:
      PG_MIGRATION_DSN: postgresql+psycopg://smartbiz_owner:${PG_OWNER_PASSWORD}@postgres-test10:5432/smartbiz_test10
    depends_on:
      postgres-test10:
        condition: service_healthy
  pgtest10:
    profiles: ['pgtest10']
    build: .
    command: ['python','-m','pytest','-q','tests/test_gateway_pg_live.py']
    environment:
      RUN_PG_LIVE_TESTS: '1'
      PG_APP_DSN: postgresql://smartbiz_app:${PG_APP_PASSWORD}@postgres-test10:5432/smartbiz_test10
      PG_WORKER_DSN: postgresql://smartbiz_worker:${PG_WORKER_PASSWORD}@postgres-test10:5432/smartbiz_test10
    volumes:
      - ./tests:/srv/app/tests:ro
    depends_on:
      migrate-test10:
        condition: service_completed_successfully
